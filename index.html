<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>MF Merry Christmas</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; background: #100f17; }
  main {
    width: 100%; height: 100%; height: 100dvh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    display: flex; justify-content: center; align-items: center;
  }
  #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  canvas:focus { outline: none; }
  canvas:focus-visible { outline: 1px solid #d399ad; outline-offset: -2px; }
  #heart-wish, #wish-light { position: absolute; transform: translate(-50%, -50%); }
  #heart-wish { z-index: 1; appearance: none; border: 0; padding: 0; margin: 0; border-radius: 50%; background: transparent; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #heart-wish:focus-visible { outline: 1px dotted #ffd5db; outline-offset: 2px; }
  #wish-light { pointer-events: none; max-width: none; max-height: none; }
  #heart-wish[hidden], #wish-light[hidden] { display: none; }
  #open-card {
    position: absolute; z-index: 2; top: 50%; left: 50%; transform: translate(-50%, -50%);
    min-height: 48px; padding: 12px 24px; white-space: nowrap; cursor: pointer;
    color: #ffe7db; background: #251a27; border: 1px solid #94677d; border-radius: 24px;
    font: 400 16px/1.4 Georgia, "Songti SC", SimSun, serif; letter-spacing: .08em;
    touch-action: manipulation;
  }
  #open-card[hidden] { display: none; }
  #open-card:focus-visible { outline: 2px solid #ffd5db; outline-offset: 4px; }
  audio { display: none; }
  noscript { position: absolute; color: #ffe3ce; }
</style>
</head>

<script id="scene">
/* The geometry is drawn in a small world centred on the tree. */
globalThis.makeTreeScene = function makeTreeScene(canvas, createCanvas, photo) {
  'use strict';
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const BASE = 579, HEIGHT = 451, TURNS = 5.4;
  const treeSettlesAt = 8.4;
  const snowfallEndsAt = treeSettlesAt + 2.6;
  const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  const ramp = (a, b, v) => {
    const u = clamp((v - a) / (b - a));
    return u * u * (3 - 2 * u);
  };
  function randomSource(seed) {
    return () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
  }
  const rand = randomSource(122508);
  const greeting = 'MF Merry Christmas';
  let lastShape = '', art, worldScale, yOffset, width, radius, ringRadius;
  let dust, nextDust, glow, background, heart, stars, jewels, depthFog;
  let snowfall, snowSprites;
  const palette = [
    [245,122,166], [230,99,146], [255,165,190], [255,200,205],
    [253,214,183], [185,86,132], [255,231,213], [221,125,166]
  ];
  function glowDot(c, x, y, size, strength, gold = false) {
    if (size < .1 || strength < .006) return;
    c.globalAlpha = Math.min(1, strength);
    c.drawImage(glow[gold ? 1 : 0], x-size, y-size, size*2, size*2);
    c.globalAlpha = 1;
  }
  function lightSprite(gold) {
    const a = createCanvas(80,80), c = a.getContext('2d'), g = c.createRadialGradient(40,40,0,40,40,40);
    g.addColorStop(0,'rgba(255,251,236,1)');
    g.addColorStop(.075,gold ? 'rgba(255,235,197,.97)' : 'rgba(255,217,224,.98)');
    g.addColorStop(.20,gold ? 'rgba(255,202,146,.66)' : 'rgba(255,149,192,.68)');
    g.addColorStop(.45,gold ? 'rgba(255,178,117,.18)' : 'rgba(250,101,160,.20)');
    g.addColorStop(1, 'rgba(242,98,153,0)');
    c.fillStyle=g; c.fillRect(0,0,80,80); return a;
  }
  function ellipseBloom(c,x,y,rx,ry,stops) {
    c.save(); c.translate(x,y); c.scale(rx,ry);
    const g = c.createRadialGradient(0,0,0,0,0,1);
    for (const [v,col] of stops) g.addColorStop(v,col);
    c.fillStyle=g; c.fillRect(-1,-1,2,2); c.restore();
  }
  function ribbon(u) {
    const r = radius * Math.pow(1-u,.86) * 1.035;
    const a = u*TAU*TURNS + 1.90;
    return [-r*Math.cos(a), BASE-HEIGHT*u + .187*r*Math.sin(a), Math.sin(a)];
  }
  function makeHeart() {
    const a=createCanvas(136,126), c=a.getContext('2d');
    const r=randomSource(1409);
    function point(t,s) {
      return [68+2.70*s*16*Math.sin(t)**3,
        56-2.82*s*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))];
    }
    ellipseBloom(c,68,61,65,54,[[0,'rgba(255,122,175,.21)'],[1,'rgba(190,78,140,0)']]);
    for(let i=0;i<4100;i++) {
      const t=r()*TAU, s=(i%4===0 ? .90+.10*r() : Math.sqrt(r())), [x,y]=point(t,s);
      const light=clamp(.23+.44*(y/110)+.15*Math.sin(t*3+s*4)+.36*r());
      const col=palette[Math.floor(r()*palette.length)];
      c.fillStyle='rgba('+col.join(',')+','+light.toFixed(2)+')';
      const z=.55+1.13*r()**2; c.fillRect(x,y,z,z);
    }
    c.beginPath();
    for(let i=0;i<=170;i++){const [x,y]=point(i/170*TAU,1); if(!i)c.moveTo(x,y);else c.lineTo(x,y);}
    c.closePath(); c.lineWidth=.64; c.strokeStyle='rgba(255,206,220,.55)'; c.stroke();
    return a;
  }
  function makeSpace() {
    const a=createCanvas(Math.ceil(width),720), c=a.getContext('2d');
    c.fillStyle='#100f17'; c.fillRect(0,0,width,720);
    ellipseBloom(c,width*.53,332,width*.58,410,[[0,'rgba(67,39,54,.42)'],[.54,'rgba(43,31,42,.24)'],[1,'rgba(18,15,24,0)']]);
    ellipseBloom(c,width*.5,BASE+1,ringRadius*1.25,102,[[0,'rgba(124,45,79,.21)'],[.60,'rgba(79,38,60,.13)'],[1,'rgba(23,18,27,0)']]);
    const r=randomSource(10702);
    for(let i=0;i<width*6;i++) {
      c.fillStyle=i%2 ? 'rgba(235,190,215,.025)' : 'rgba(4,3,11,.13)';
      c.fillRect(r()*width,r()*720,.5+r()*1.2,.6+r());
    }
    if(width>820) {
      const script=['def ribbon(u):','    angle = tau * turns * u','    radius = base * (1 - u) ** .86','    x = radius * cos(angle)','    y = height * u','    z = radius * sin(angle)','    return x, y, z'];
      c.font='11px "Courier New", monospace'; c.fillStyle='rgba(190,165,185,.20)';
      script.forEach((line,i)=>c.fillText(line,Math.max(25,width*.04),284+i*19));
    }
    return a;
  }
  function buildDust() {
    const r=randomSource(251201), dots=[], flashes=[];
    for(let i=0;i<32500;i++){
      const u=1-Math.sqrt(r()), a=r()*TAU;
      const b=radius*Math.pow(1-u,.87), phase=u*TAU*TURNS+1.90;
      const winding=Math.cos(a-phase);
      const shelf=.91+.085*Math.cos(u*TAU*6.3+a*.96+.20*Math.sin(3*a));
      const rho=b*shelf*(i%9===0 ? Math.sqrt(r()) : .78+.22*Math.sqrt(r()));
      const depth=Math.sin(a);
      const x=rho*Math.cos(a)+(r()-.5)*2.8;
      const y=BASE-HEIGHT*u+depth*rho*.187+(r()-.5)*3.7;
      const side=(1+depth)*.5;
      const gain=.41+.52*side+.60*Math.max(0,winding)**4;
      const z=r();
      const size=.49+1.72*z**2+(i%53===0?r()*1.6:0);
      const alpha=clamp((.24+.73*r()**1.12)*gain,.075,.95);
      const col=palette[Math.floor(r()*palette.length)];
      dots.push({x:-x,y,size,col:'rgba('+col.join(',')+','+alpha.toFixed(2)+')',
        show:Math.max(.001,u + .018*(1-winding) + .015*r())});
      if(i%112===0) flashes.push({x:-x,y,u,phase:r()*TAU,speed:1.1+1.8*r(),size:3.1+8.6*r()**2,gold:r()<.37});
    }
    dots.sort((a,b)=>a.show-b.show);return [dots,flashes];
  }

  // Each crystal is drawn once. A flake's path is a function of the card's clock,
  // so pausing, replaying, and rotating the phone keep it in step with the ribbon.
  function iceCrystal(branch, warm) {
    const tile = createCanvas(80, 80), c = tile.getContext('2d');
    c.translate(40, 40);
    c.lineCap = 'round';
    c.beginPath();
    for (let arm = 0; arm < 6; arm++) {
      c.moveTo(0, 0); c.lineTo(0, -32);
      c.moveTo(-7, -25); c.lineTo(0, -16); c.lineTo(7, -25);
      if (branch) {
        c.moveTo(-4.4, -31); c.lineTo(0, -25); c.lineTo(4.4, -31);
      }
      c.rotate(TAU / 6);
    }
    c.lineWidth = 7;
    c.strokeStyle = warm ? 'rgba(255,159,185,.22)' : 'rgba(178,208,240,.18)';
    c.stroke();
    c.lineWidth = 3.9;
    c.strokeStyle = warm ? '#ffe1cb' : '#eff6ff';
    c.stroke();
    c.fillStyle = warm ? '#fff2dc' : '#f9fcff';
    c.beginPath(); c.arc(0, 0, 3.7, 0, TAU); c.fill();
    return tile;
  }
  function seedSnow() {
    const r = randomSource(241224);
    const travel = BASE + 72 + yOffset;
    const layers = [[], []];
    for (let layer = 0; layer < 2; layer++) {
      const count = Math.round(width * (layer ? .035 : .067));
      for (let i = 0; i < count; i++) {
        layers[layer].push({
          x: ((i + r()) / count - .5) * width, distance: r() * travel,
          speed: layer ? 57 + r() * 37 : 27 + r() * 29,
          sway: layer ? 10 + 11*r() : 4 + 9*r(), phase: TAU*r(),
          turn: (r()-.5)*1.23, frequency: .43+.38*r(),
          size: layer ? 2.7+3.3*r() : .60+1.05*r(),
          opacity: layer ? .55+.36*r() : .32+.37*r(),
          style: Math.floor(r()*2), lingers: i % (layer ? 3 : 7) === 1
        });
      }
    }
    return layers;
  }
  function stampFlake(x, y, size, angle, opacity, style, warm = false) {
    if (opacity <= .01) return;
    ctx.save(); ctx.globalAlpha = opacity;
    ctx.translate(x, y); ctx.rotate(angle);
    const sprite = snowSprites[style + (warm ? 2 : 0)];
    ctx.drawImage(sprite, -size, -size, 2*size, 2*size);
    ctx.restore();
  }
  function fallingSnow(t, layer) {
    if (t >= snowfallEndsAt) return;
    const sky = -yOffset - 7, floor = BASE + 65;
    const travel = floor - sky;
    const arrival = ramp(.03, .72, t);
    const hush = 1 - .60*ramp(6.05, 7.85, t);
    const tail = Math.max(0, t-treeSettlesAt);
    // Keep each flake on its falling path as the wind eases. No new snow
    // enters from above after the card has settled.
    const drift = tail * (1 - .26*tail/(snowfallEndsAt-treeSettlesAt));
    const clock = Math.min(t,treeSettlesAt) + drift;
    ctx.save();
    for (const f of snowfall[layer]) {
      const distance = (f.distance + Math.min(t,treeSettlesAt)*f.speed) % travel + drift*f.speed;
      if (distance >= travel) continue;
      const y = sky + distance;
      const x = f.x + f.sway*Math.sin(clock*f.frequency + f.phase)
                    + 8*Math.sin(.44*clock + y*.004);
      const depth = ramp(sky, sky+15, y) * (1-ramp(BASE-6, floor, y));
      const remaining = f.lingers
        ? 1-ramp(treeSettlesAt+.64, snowfallEndsAt, t)
        : 1-ramp(treeSettlesAt-.84, treeSettlesAt+.24, t);

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('card');
  const stage = document.getElementById('stage');
  const audio = document.getElementById('chimes');
  const heartButton = document.getElementById('heart-wish');
  const openCard = document.getElementById('open-card');
  const light = document.getElementById('wish-light');
  const ink = light.getContext('2d');
  const label = '粉色圣诞树，合照中的人物和小狗，MF Merry Christmas。';
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const photo = document.getElementById('mf-photo');
  const scene = makeTreeScene(canvas, (width, height) => {
    const layer = document.createElement('canvas');
    layer.width = width;
    layer.height = height;
    return layer;
  }, photo);
  const total = scene.snowfallEndsAt;
  let invite = !motion.matches;
  let elapsed = motion.matches ? total : 0;
  let playing = false, audible = false, resumeOnShow = false;
  let unopened = !motion.matches;
  let origin = performance.now(), frame = 0, lastPaint = -Infinity, audioAttempt = 0;
  let wishFrame = 0, wishStart = -Infinity, lastWish = -Infinity, alternate = false;
  let bellContext;
  const wishOrigin = { x: 0, y: 0 };
  const ringStars = Array.from({length: 31}, (_, i) => {
    const a = (i + .29*Math.sin(3.8*i)) * Math.PI*2/31;
    return { a, radius: 74+12*Math.sin(2.26*i)+6*Math.cos(.89*i),
      delay: .12*(.5+.5*Math.sin(2.73*i)), size: i%3===0 ? 3.4+.9*Math.cos(i) : 1.5,
      color: ['#ffe3bc','#ffb7d3','#fff3df','#f5a8c9'][i%4] };
  });

  function updateHeart() {
    heartButton.hidden = elapsed < 6.74;
  }
  function placeWish() {
    const card = canvas.getBoundingClientRect(), box = stage.getBoundingClientRect();
    const heart = scene.heartPosition(), cssScale = card.width/canvas.width;
    const x = card.left-box.left+heart.x*cssScale, y = card.top-box.top+heart.y*cssScale;
    const size = Math.max(48,74*cssScale*heart.scale);
    heartButton.style.left = light.style.left = x+'px';
    heartButton.style.top = light.style.top = y+'px';
    heartButton.style.width = heartButton.style.height = size+'px';
    const side = Math.max(182,Math.min(330,284*cssScale*heart.scale));
    light.style.width = light.style.height = side+'px';
    const pixels = Math.round(side*Math.min(2,window.devicePixelRatio || 1));

  }
  function clearWish() {
    cancelAnimationFrame(wishFrame);

  }
  function star(x,y,r) {
    ink.beginPath();
    ink.moveTo(x,y-r*1.24);

  async function ringBell() {

  function describe() {

      hasSound = true;
    } catch (error) {
      if (attempt !== audioAttempt || !unopened || document.hidden) return;
      if (!byTouch && error.name === 'NotAllowedError') {
        openCard.hidden = false;
        return;
      }
      // A missing decoder or unavailable audio output must not strand the card.
    }
    if (attempt !== audioAttempt || !unopened || document.hidden) return;
    const moveFocus = document.activeElement === openCard;
    unopened = false;
    openCard.hidden = true;
    audible = hasSound;
    elapsed = hasSound ? Math.min(scene.treeSettlesAt, audio.currentTime) : 0;
    playing = true;
    origin = performance.now() - elapsed * 1000;
    lastPaint = -Infinity;
    describe();
    if (moveFocus) canvas.focus({preventScroll:true});
    frame = requestAnimationFrame(tick);
  }
  openCard.addEventListener('click', () => startOpening(true));

  function pause() {
    if (playing) elapsed = Math.min(total, (performance.now() - origin) / 1000);
    playing = false;
    cancelAnimationFrame(frame);
    audioAttempt++;
    audio.pause();
    describe();
  }

  function tick(now) {
    if (!playing) return;
    const couldReplay = elapsed >= scene.treeSettlesAt;
    elapsed = Math.min(total, (now - origin) / 1000);
    if (!couldReplay && elapsed >= scene.treeSettlesAt) describe();
    if (now - lastPaint >= 31 || elapsed >= total) {
      scene.draw(elapsed,invite);
      updateHeart();
      lastPaint = now;
    }
    if (elapsed >= total) pause();
    else frame = requestAnimationFrame(tick);
  }

  function play(from) {
    cancelAnimationFrame(frame);
    if (from===0) { clearWish(); invite=!motion.matches; }
    elapsed = from;
    playing = true;
    origin = performance.now() - elapsed * 1000;
    lastPaint = -Infinity;
    scene.draw(elapsed,invite);
    updateHeart();
    playSound();
    describe();
    frame = requestAnimationFrame(tick);
  }

  function activate() {
    if (unopened) {
      startOpening(true);
    } else if (elapsed >= scene.treeSettlesAt) {
      audible = true;
      play(0);
    } else if (!playing) {
      audible = true;
      play(elapsed);
    } else if (!audible) {
      audible = true;
      playSound();
      describe();
    } else {
      pause();
    }
  }
  canvas.addEventListener('click', activate);
  canvas.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      if (!event.repeat) activate();
    }
  });
  function suspend() {
    clearWish();
    if (unopened) {
      audioAttempt++;
      audio.pause();
      openCard.hidden = false;
      return;
    }
    if (bellContext) {
      const previousBell=bellContext;
      bellContext=null;
      previousBell.close().catch(()=>{});
    }
    if (!playing) return;
    resumeOnShow = true;
    pause();
  }
  function restore() {
    if (unopened) return;
    if (!resumeOnShow || document.hidden) return;
    resumeOnShow = false;
    if (elapsed < total) play(elapsed);
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) suspend(); else restore(); });
  window.addEventListener('pagehide', suspend);
  window.addEventListener('pageshow', restore);
  window.addEventListener('resize', sizeScene);
  if (window.ResizeObserver) new ResizeObserver(sizeScene).observe(stage);
  photo.addEventListener('load', () => scene.draw(elapsed,invite), {once:true});
  sizeScene();
  describe();
  if (unopened) {
    if (document.hidden) openCard.hidden = false;
    else startOpening();
  }
})();
</script>
</body>
</html>
